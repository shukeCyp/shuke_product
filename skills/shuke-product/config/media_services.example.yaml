# 媒体与视频分析服务配置示例。
# 复制为 media_services.yaml 后填入密钥；media_services.yaml 已在 .gitignore 中排除。

flow2api:
  # Flow2API 服务地址和密钥：用于图片生成、视频生成等媒体生成请求。
  # 两台机器的 URL 可能不同，按需配置。
  base_url: "https://your-flow2api-host"
  api_key: "your-flow2api-api-key"
  concurrency_limit: 5
  models:
    image_default: "gemini-3.1-flash-image-portrait"
    text_to_video_default: "veo_3_1_t2v_fast_portrait"
    image_to_video_default: "veo_3_1_i2v_s_fast_portrait_fl"
    multi_reference_video_default: "veo_3_1_r2v_fast_portrait"
    interpolation_lite: "veo_3_1_interpolation_lite_portrait"

cloudy_veo:
  # Cloudy / W Project HOLO API — URL 固定，填入你的 key 即可。
  base_url: "https://api.dealonhorizon.us"
  api_key: "your-cloudy-api-key"
  concurrency_limit: 3
  models:
    text_to_video_default: "veo_3_1_t2v_fast_portrait"
    image_to_video_default: "veo_3_1_i2v_fast_portrait"
    multi_reference_video_default: "veo_3_1_r2v_fast_portrait"


chaowenai:
  # 超稳AI (ChaowenAI) 服务地址：支持图片生成和视频生成，统一 /v1/videos 端点。
  base_url: "https://api.chaowenai.com"
  # 图片和视频使用不同的 API Key（不同模型分组）
  api_key_image: "your-chaowenai-image-key"
  api_key_video: "your-chaowenai-video-key"
  concurrency_limit: 3
  timeout: 600
  models:
    # 默认图片模型：文生图/图生图
    image_default: "nano-banana-2"
    # 默认文生视频模型
    text_to_video_default: "veo3.1-fast"
    # 默认图生视频/首尾帧模型
    image_to_video_default: "veo3.1-fast"
    # 默认参考图转视频模型
    multi_reference_video_default: "veo3.1-lite"

bandianwa:
  # 斑点蛙 (Bandianwa) GPT Image API — 填入你的 URL 和 key 即可。
  base_url: "https://api.hellobabygo.com"
  api_key: ""   # ← 填入斑点蛙 API Key
  concurrency_limit: 3
  models:
    image_default: "gpt-image-2"

catking:
  # CatKing API — Veo 视频生成，URL 固定。
  base_url: "https://api.catking.top"
  api_key: "sk-xxxxx"
  concurrency_limit: 3
  models:
    text_to_video_default: "ali-veo-3.1-portrait-8s-1080p"
    reference_to_video_default: "ali-veo-3.1-portrait-8s-1080p"

image_generation:
  # provider: "flow2api"  # 旧配置
  # provider: "bandianwa"
  provider: "chaowenai"

video_generation:
  # provider: "cloudy_veo"  # 旧配置
  # provider: "chaowenai"
  # provider: "catking"
  provider: "chaowenai"

commerce_market:
  country: "Mexico"
  country_code: "MX"
  locale: "es-MX"
  language: "Spanish"
  language_variant: "Mexican Spanish"
  currency: "MXN"
  currency_symbol: "$"
  platform_region: "Mexico"
  timezone: "America/Mexico_City"
  copy_style: "Natural Mexican Spanish ecommerce UGC"
  cta_examples:
    - "Toca el enlace para ver la promo"
    - "Aprovecha la oferta de hoy"
    - "Envío a México"

yunwu:
  # Yunwu API — URL 固定，填入你的 key 即可。
  base_url: "https://yunwu.ai"
  apifox_doc_url: "https://yunwu.apifox.cn/api-309482709"
  api_key: "your-yunwu-api-key"
  models:
    analysis_preferred: "gemini-3.1-pro-preview"
    analysis_fallback: "gemini-2.5-pro"

