interface:
  display_name: "产品图分镜视频"
  short_description: "从产品图生成产品、角色、多视图场景参考，并审核首帧异常。"
  default_prompt: "我提供一张产品图，请先用 imagegen 生成产品参考板，再用 flow2api 并发生成角色多视图表情细节图和多视图场景参考板；之后基于这些参考检索素材库、定制连续实拍带货分镜、首帧图和8秒视频提示词；所有使用 flow2api 的生图都要按并发批次执行并遵守并发上限；所有首帧图生成后请逐张审核是否穿模、手部异常、包装错误、人物漂移或场景不一致，有问题先重生成再进入视频生成。"
