# 媒体与视频分析服务配置示例。
# 复制为 media_services.yaml 后填入真实密钥；media_services.yaml 已被 .gitignore 忽略。

flow2api:
  # Flow2API 服务地址：用于图片生成、图片编辑、文生视频、图生视频等媒体生成请求。
  base_url: "https://example-flow2api-host"
  # Flow2API API Key：用于 Authorization: Bearer <api_key> 鉴权，请勿提交到 git。
  api_key: "replace-with-flow2api-api-key"
  # 并发上限：同一时间最多发起的图片/视频生成请求总数。
  concurrency_limit: 5
  models:
    # 默认图片模型：用于竖版商品图、首帧图、参考图生成和图片编辑。
    image_default: "replace-with-image-model"
    # 默认文生视频模型：用于没有首帧图片、只靠文本生成视频的场景。
    text_to_video_default: "replace-with-text-to-video-model"
    # 默认图生视频模型：用于用首帧图或首尾帧生成视频的场景。
    image_to_video_default: "replace-with-image-to-video-model"
    # 默认多参考图视频模型：用于多个参考图共同约束视频生成的场景。
    multi_reference_video_default: "replace-with-multi-reference-video-model"
    # 默认首尾帧过渡模型：用于明确要求 first/last-frame transition 的场景。
    interpolation_lite: "replace-with-interpolation-model"

image_generation:
  # 生图提供方开关：决定“所有生图”（主图/母图/分镜首帧等）走哪个服务。
  # - flow2api：走 Flow2API 的 /v1/chat/completions
  provider: "flow2api"

video_generation:
  # 视频生成提供方开关：决定“所有视频生成”走哪个服务。
  # - flow2api：走 Flow2API 的 /v1/chat/completions
  provider: "flow2api"

yunwu:
  # Yunwu API 服务根地址：用于拼接 Gemini video understanding 请求端点。
  base_url: "https://example-yunwu-host"
  # Yunwu Apifox 文档地址：仅用于查阅接口说明，不参与请求鉴权。
  apifox_doc_url: "https://example-doc-url"
  # Yunwu API Key：用于 Authorization Bearer 和 key 查询参数，请勿提交到 git。
  api_key: "replace-with-yunwu-api-key"
  models:
    # 首选视频分析模型：用于深度带货视频拆解。
    analysis_preferred: "replace-with-preferred-analysis-model"
    # 兼容回退模型：首选模型不可用时使用。
    analysis_fallback: "replace-with-fallback-analysis-model"

google_prompting:
  nano_banana2:
    # Nano Banana 2 官方模型代号：用于图片提示词技能中指向默认图片模型。
    official_model: "replace-with-nano-banana-2-model"
  veo31:
    # Veo 3.1 Vertex AI 模型代号列表：用于视频提示词技能中说明可选官方模型。
    vertex_ai_models:
      - "replace-with-veo31-model-1"
      - "replace-with-veo31-model-2"
      - "replace-with-veo31-model-3"
